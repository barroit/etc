include config/color
include config/binding

font_family family='JetBrains Mono NL'
# <dev-ubuntu>
# font_size 20
# </dev-ubuntu>
# <dev-macos>
# font_size 28
# </dev-macos>

allow_hyperlinks no

linux_display_server wayland

shell_integration no-complete no-cursor no-cwd no-prompt-mark no-title

cursor_shape_unfocused unchanged
cursor_stop_blinking_after 0

scrollbar_jump_on_click no
scrollbar_hover_width 0.5
scrollbar_track_hover_opacity 0

initial_window_width  48
initial_window_height 80
remember_window_position yes
placement_strategy top

tab_bar_min_tabs 1
tab_bar_show_new_tab_button yes
tab_bar_style powerline
tab_powerline_style angled
active_tab_font_style bold
